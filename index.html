    <script>
        function loadSimData() {
            const searchValue = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('results-container');
            
            // Check if the input is empty
            if (!searchValue) {
                container.innerHTML = '<p style="color:red;">Please enter a mobile number or CNIC to search.</p>';
                return;
            }

            // Show a loading message while fetching
            container.innerHTML = '<p>Loading data...</p>';

            // 1. Define your original API URL (using standard http)
            const targetUrl = `http://wasifali.biz.id/public_apis/sim-info-api.php?search=${searchValue}`;
            
            // 2. Wrap it in a free secure Proxy to bypass GitHub's HTTPS block
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

            // Fetch using the proxy
            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Proxy blocked or API down');
                    return response.json();
                })
                .then(data => {
                    if (data.success && data.records && data.records.length > 0) {
                        
                        let html = `
                            <p><strong>Total Records Found:</strong> ${data.count}</p>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Mobile</th>
                                        <th>CNIC</th>
                                        <th>Address</th>
                                        <th>Network</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                        
                        data.records.forEach(record => {
                            html += `
                                <tr>
                                    <td>${record.name}</td>
                                    <td>${record.mobile}</td>
                                    <td>${record.cnic}</td>
                                    <td>${record.address}</td>
                                    <td>${record.network}</td>
                                </tr>`;
                        });
                        
                        html += `
                                </tbody>
                            </table>`;
                        
                        if (data.developer) {
                            html += `
                                <div class="dev-info">
                                    <p>Developer: ${data.developer} | Telegram: ${data.telegram || 'N/A'}</p>
                                </div>`;
                        }
                        
                        container.innerHTML = html;
                        
                    } else {
                        container.innerHTML = '<p style="color:red;">No records found for this number.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    container.innerHTML = '<p style="color:red;">Error connecting to the API. It might be down or blocking the connection.</p>';
                });
        }
    </script>
