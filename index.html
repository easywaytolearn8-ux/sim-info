<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM Info Checker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .search-container { margin-bottom: 20px; }
        input[type="text"] { padding: 10px; width: 250px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .dev-info { margin-top: 20px; font-size: 0.9em; color: #555; }
    </style>
</head>
<body>

    <h2>SIM Information Search</h2>
    
    <!-- Search Box for User Input -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="e.g., 03417090793">
        <button onclick="loadSimData()">Search</button>
    </div>

    <!-- The table and results will be generated inside this div -->
    <div id="results-container"></div>

    <script>
        function loadSimData() {
            // Get the value typed into the search box
            const searchValue = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('results-container');
            
            // Check if the input is empty
            if (!searchValue) {
                container.innerHTML = '<p style="color:red;">Please enter a mobile number or CNIC to search.</p>';
                return;
            }

            // Show a loading message while fetching
            container.innerHTML = '<p>Loading data...</p>';

            // Build the live API link dynamically using HTTPS
            const apiLink = `https://wasifali.biz.id/public_apis/sim-info-api.php?search=${searchValue}`;

            fetch(apiLink)
                .then(response => response.json())
                .then(data => {
                    // Check if the API returned a success status and has records
                    if (data.success && data.records && data.records.length > 0) {
                        
                        let html = `
                            <p><strong>Total Records Found:</strong> ${data.count}</p>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Mobile</th>
                                        <th>CNIC</th>
                                        <th>Address</th>
                                        <th>Network</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                        
                        // Loop through each record in the JSON and add a table row
                        data.records.forEach(record => {
                            html += `
                                <tr>
                                    <td>${record.name}</td>
                                    <td>${record.mobile}</td>
                                    <td>${record.cnic}</td>
                                    <td>${record.address}</td>
                                    <td>${record.network}</td>
                                </tr>`;
                        });
                        
                        html += `
                                </tbody>
                            </table>`;
                        
                        // Add the developer info at the bottom
                        if (data.developer) {
                            html += `
                                <div class="dev-info">
                                    <p>Developer: ${data.developer} | Telegram: ${data.telegram || 'N/A'}</p>
                                </div>`;
                        }
                        
                        container.innerHTML = html;
                        
                    } else {
                        container.innerHTML = '<p style="color:red;">No records found for this number.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    container.innerHTML = '<p style="color:red;">Error connecting to the API. It might be down or blocking the connection.</p>';
                });
        }
    </script>
</body>
</html>
